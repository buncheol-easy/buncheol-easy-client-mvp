name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude re-review'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      # PR 메타·diff 를 미리 받아둔다. 에이전트가 gh 호출로 턴을 쓰지 않게 하려는 것.
      # 워크스페이스 밖(RUNNER_TEMP)에 두는 이유: 레포 안에 diff 파일이 있으면 사용처 Grep 에 걸려
      # 존재하지 않는 사용처를 찾은 것처럼 오인한다.
      - name: Prefetch PR context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          CTX="$RUNNER_TEMP/pr-context"
          mkdir -p "$CTX"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,baseRefName,headRefName,additions,deletions,changedFiles,files \
            > "$CTX/meta.json"
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > "$CTX/diff.patch"
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only > "$CTX/changed-files.txt"
          {
            jq -r '"# PR #\(.number) \(.title)\n작성자: \(.author.login)\nbase: \(.baseRefName) ← head: \(.headRefName)\n변경량: +\(.additions)/-\(.deletions), \(.changedFiles) files\n"' "$CTX/meta.json"
            echo "## 변경 파일"
            jq -r '.files[] | "- \(.path) (+\(.additions)/-\(.deletions))"' "$CTX/meta.json"
            printf '\n## PR 본문\n%s\n' "$(jq -r '.body // "(본문 없음)"' "$CTX/meta.json")"
          } > "$CTX/summary.md"
          wc -l "$CTX"/* || true

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            이 PR 을 리뷰하고 결과를 한국어 코멘트 1건으로 게시하세요.
            레포 전체가 현재 디렉터리에 체크아웃되어 있습니다.

            PR 컨텍스트는 이미 수집되어 있습니다 — `${{ runner.temp }}/pr-context/`
            - `summary.md`        PR 제목·작성자·변경 파일 목록(파일별 증감 포함)·PR 본문
            - `diff.patch`        전체 diff
            - `changed-files.txt` 변경 파일 경로 목록
            - `meta.json`         gh pr view 원본 JSON

            ## 실행 방식 (속도 요건 — 반드시 지킬 것)

            - `gh pr view` / `gh pr diff` 를 다시 호출하지 마세요. 위 파일을 Read 로 읽습니다.
              (Read 가 실패할 때만 `gh pr diff` 로 폴백)
            - **도구 호출은 항상 한 메시지에 여러 개를 병렬로 묶으세요.** 파일 10개를 볼 거면
              한 턴에 Read 10개를 동시에 호출합니다. 한 턴에 하나씩 순차로 읽지 마세요. Grep 도 같습니다.
            - 리뷰 본체는 아래 3개 축으로 나눠 **Task 도구로 서브에이전트 3개를 한 메시지에서 동시에**
              띄워 병렬 수행합니다. 하나씩 순차로 띄우지 마세요. 메인은 취합·게시만 합니다.
            - 코드를 수정하지 마세요. 읽기와 코멘트 게시만 합니다.

            ## 0단계 — 변경 파악 (1턴)

            `summary.md` 와 `diff.patch` 를 한 턴에 병렬 Read 로 읽고 변경 의도·범위를 파악합니다.
            2단계의 요약 작성과 축 간 판정 충돌 조정은 메인이 직접 본 내용을 근거로 해야 합니다.

            ## 1단계 — 서브에이전트 3개 동시 실행

            각 서브에이전트(general-purpose) 프롬프트에 공통으로 넣을 지침:

            - PR 컨텍스트 경로는 `${{ runner.temp }}/pr-context/` 이고, 레포는 현재 디렉터리에 있다.
              먼저 `summary.md` 와 `diff.patch` 를 읽고 시작한다.
            - diff 조각만 보고 판단하지 않는다. `changed-files.txt` 의 파일들을 **전체를 Read 로**
              읽어 변경이 놓인 맥락을 확인한다 (여러 파일을 한 턴에 병렬 Read).
            - 변경된 컴포넌트·훅·유틸의 사용처를 Grep 으로 추적해 영향 범위를 검증한다
              (한 턴에 여러 Grep 병렬 호출).
            - `CLAUDE.md` 와 같은 성격의 기존 코드(인접 컴포넌트·페이지)를 읽고 컨벤션·패턴 일치를 대조한다.
              Next.js 최신 API 판단이 필요하면 `node_modules/next/dist/docs/` 의 해당 문서를 확인한다
              (학습 데이터의 Next.js 관례로 단정하지 않는다).
            - **확신이 없는 지적은 관련 코드를 실제로 열어 확인한 뒤에만 보고한다.** 확인하지 못했으면
              보고하지 말고, 확인이 필요한 사항이면 "확인 필요"로 표시한다. diff 밖 코드를 근거로 한
              지적에는 반드시 `파일경로:라인` 을 근거로 명시한다.
            - 사용할 도구는 Read / Grep / Glob 뿐이다. 코멘트를 게시하지 않는다. 코드를 수정하지 않는다.
            - 반환값은 발견 항목 목록만. 항목마다:
              `[심각도 Critical|Major|Minor|Suggestion] 파일:라인 · 제목 / 문제 / 근거 / 개선안`.
              발견이 없으면 "없음". 잘한 점이 있으면 끝에 `좋았던 점:` 으로 1~3개 덧붙인다.

            축별 담당 범위:

            **축 A — 정합성·버그·데이터 계약**
            - 사용처와의 계약 불일치 (props 시그니처·optional 여부·기본값·이벤트 핸들러 계약 변화)
            - 공유 상태/컨텍스트·전역 스토어·React Query 캐시 키에 미치는 영향
            - API 응답 파싱: 백엔드 호출·파싱은 `lib/auth-api.ts` 한 곳에 모여 있고 별칭 키로 조용히
              폴백한다. 필드명 grep 만으로 단정하지 말고 파서 폴백 목록과 실제 응답 형태를 확인한다
            - 실행 위치 분기: 브라우저(`/api/backend/v1/...` 프록시) vs 서버 렌더링
              (`NEXT_PUBLIC_API_BASE_URL` 직접 호출) 경로에서 동작이 갈리는지
            - 비동기 경합, useEffect 의존성 배열, 조건부 훅, 클린업 누락, null/undefined 처리

            **축 B — 컨벤션·품질**
            - CLAUDE.md 규약: 주석 규칙(코드 재서술·작업 경위 금지, 비자명한 정책·외부 계약·함정만),
              인접 컴포넌트·페이지와의 네이밍·구조·파일 배치 일관성
            - Next.js API 사용의 정확성 (`node_modules/next/dist/docs/` 기준, deprecation 확인)
            - 타입 안전성 (any·과도한 단언·좁혀지지 않는 유니온), 중복 로직, 가독성
            - 변경 대비 테스트/검증 공백

            **축 C — 성능·보안·표시 모드**
            - 불필요한 리렌더(메모이제이션 누락·인라인 객체/함수 전달), 과도한 클라이언트 번들
              (`"use client"` 경계가 필요 이상으로 위로 올라갔는지), 무거운 의존성 추가
            - 데이터 페칭: 중복 요청, 워터폴, 캐시/재검증 설정, 이미지 최적화
            - XSS(`dangerouslySetInnerHTML`), 클라이언트 번들로 새는 시크릿·토큰,
              `NEXT_PUBLIC_` 접두사 오남용, 개인정보의 로그·URL 노출
            - 모바일 웹뷰·PWA·데스크톱 셸 등 표시 모드별 레이아웃 회귀 가능성
              (safe-area, 고정 헤더/하단바, 뷰포트 높이, 스크롤 컨테이너)

            ## 2단계 — 취합 후 코멘트 1건 게시

            - 3개 결과를 합쳐 중복을 제거하고 심각도 순으로 정렬합니다.
            - 근거가 약하거나 서브에이전트가 실제로 확인하지 못한 추측성 지적은 버립니다.
            - 축이 서로 충돌하면 코드를 직접 열어 확인한 뒤 판단합니다.
            - 아래 형식으로 `gh pr comment` 를 **한 번만** 호출해 게시합니다.
              리뷰 텍스트를 메시지로만 출력하고 끝내지 마세요.

            ```
            ## 📋 리뷰 요약

            - **리뷰 대상**: 변경의 핵심 지점 요약
            - **전체 평가**: 2~4문장
            - **발견 이슈**: Critical N개 / Major N개 / Minor N개 / Suggestion N개

            ## 🔴 Critical
            ### [파일명:라인] 한 줄 제목
            **문제**: ...
            **근거**: ... (diff 밖이면 파일경로:라인 명시)
            **개선안**: ...

            ## 🟠 Major
            ## 🟡 Minor
            ## 💡 Suggestion
            ## ✅ 좋았던 점
            ```

            해당 심각도의 항목이 없으면 그 절은 통째로 생략합니다.
          claude_args: |
            --model opus
            --allowedTools "Read,Grep,Glob,Task,Agent,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(ls:*),Bash(find:*),Bash(wc:*),Bash(rg:*)"
            --append-system-prompt "이 실행은 GitHub Actions 의 PR 코드리뷰 전용이다. 저장소 CLAUDE.md 의 커밋/PR 작성 규칙 섹션은 이 실행에 적용하지 않는다(코드 컨벤션·주석 규칙 섹션은 리뷰 기준으로 그대로 사용한다). 코드를 수정하지 않고 리뷰 코멘트 1건만 게시한다. 파일을 여러 개 읽거나 검색할 때는 항상 한 메시지에서 도구 호출을 병렬로 묶어 호출한다."
