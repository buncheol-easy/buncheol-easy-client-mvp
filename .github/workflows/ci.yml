name: CI

# PR(base dev/main)과 dev push 에서 lint·타입체크·빌드를 강제한다.
# 그동안 검증은 배포 이미지 빌드의 `npm run build` 하나뿐이었고 `npm run lint` 는
# CI 어디에서도 돌지 않았다 — CLAUDE.md 가 PR 전 실행을 요구했지만 강제 장치가 없었다.
# main 타깃(릴리스 PR)도 커버 — main 머지는 곧장 production 배포로 이어진다.
#
# ⚠️ 이 워크플로만으로는 머지가 막히지 않는다. branch protection 의 required status check 에
#    verify 잡을 등록해야 게이트가 된다 (#100). dev push 실행은 deploy-staging.yml 과 독립
#    트리거라 병렬로 돌므로 배포를 막지 못한다 — 사후 신호로만 본다.
on:
  push:
    branches:
      - dev
      # deploy-production.yml 이 push:main 으로 즉시 배포하므로, PR 없이 직접 푸시되는
      # 핫픽스 경로에도 최소한 사후 신호는 남긴다.
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

# 같은 PR 에 새 푸시가 오면 이전 실행을 취소한다 (러너 분수 절약).
# PR 은 pull_request.number 로, 그 외(dev push·수동 실행)는 github.ref 로 묶인다 —
# dev 에서 workflow_dispatch 하면 dev push 실행과 같은 그룹이 되어 서로를 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 배포 이미지(Dockerfile FROM node:24-alpine)와 동일 메이저. 버전은 .nvmrc 단일 출처.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        # next build 도 타입체크를 하지만, 분리하면 타입 오류가 번들링 오류보다
        # 먼저·명확하게 드러난다 (빌드 로그를 끝까지 읽지 않아도 된다).
        # typecheck 는 next typegen 을 선행한다 — 그러지 않으면 tsconfig 의
        # .next/types/** 가 0개 파일에 매칭돼 Next 가 생성하는 라우트 타입 검증이 통째로 빠진다.
        run: npm run typecheck

      - name: Build
        env:
          # 빌드 시 프리렌더되는 / 와 /sitemap.xml 이 staging 실서버를 때리지 않게 한다.
          # 값을 비우면 lib/auth-api.ts 의 staging 폴백을 타므로 도달 불가 주소로 명시한다.
          # 두 경로 모두 조회 실패 폴백이 있어(app/sitemap.ts, app/page.tsx) 빌드는 통과하고,
          # 연결이 즉시 거절되므로 결정론적으로 끝난다 — sitemap 경로엔 타임아웃이 없어
          # staging 이 매달리면 timeout-minutes 까지 대기하는 flaky red 가 난다.
          # ⚠️ 따라서 CI 빌드는 "API 미도달" 경로만 검증한다 — 실제 응답을 받아야 도는 코드
          # (app/sitemap.ts 의 createdAt 파싱 등)는 배포 빌드에서 처음 실행된다. 그 빌드는
          # 상한 없는 fetch 를 그대로 타므로 백엔드 지연이 곧 배포 실패다 (#102).
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9
        run: npm run build

      - name: Verify Dockerfile Node version matches .nvmrc
        # .nvmrc 만 올리고 Dockerfile 이 뒤처지면 "CI 통과분이 배포 빌드에서 깨지는"
        # 이 워크플로가 막으려던 상황이 그대로 재현된다. Docker 는 .nvmrc 를 못 읽는다.
        run: grep -q "FROM node:$(cat .nvmrc)-alpine" Dockerfile
