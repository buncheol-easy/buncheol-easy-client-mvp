name: CI

# PR(base dev/main)과 dev push 에서 lint·타입체크·빌드를 강제한다.
# 그동안 검증은 배포 이미지 빌드의 `npm run build` 하나뿐이었고 `npm run lint` 는
# CI 어디에서도 돌지 않았다 — AGENTS.md 가 PR 전 실행을 요구했지만 강제 장치가 없었다.
# main 타깃(릴리스 PR)도 커버 — main 머지는 곧장 production 배포로 이어진다.
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

# 같은 PR 에 새 푸시가 오면 이전 실행을 취소한다 (러너 분수 절약).
# PR 번호 기준이라 dev push 실행·수동 실행과는 그룹이 분리된다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 배포 이미지(Dockerfile FROM node:24-alpine)와 동일 메이저로 고정한다 —
          # CI 가 통과한 코드가 배포 빌드에서 깨지는 상황을 막는다.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        # next build 도 타입체크를 하지만, 분리하면 타입 오류가 번들링 오류보다
        # 먼저·명확하게 드러난다 (빌드 로그를 끝까지 읽지 않아도 된다).
        run: npm run typecheck

      - name: Build
        # 프로덕션 빌드가 통과하는지 확인. NEXT_PUBLIC_API_BASE_URL 은 주입하지 않는다 —
        # next.config.ts 가 미설정 시 경고만 남기고 staging 폴백으로 동작하며,
        # 여기서 검증하려는 것은 배포 대상 값이 아니라 빌드 가능 여부다.
        run: npm run build
