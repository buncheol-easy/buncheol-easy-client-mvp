name: Deploy Frontend Production

# main push -> GitHub 호스팅 러너가 이미지를 빌드해 ECR 에 push 하고,
# production EC2 의 self-hosted runner 는 pull + 컨테이너 교체만 한다.
# 구조·근거는 deploy-staging.yml 과 동일. 차이: 트리거 main, 러너 라벨 production,
# prod- 접두 태그, PROD_NEXT_PUBLIC_* Variables, --env-file 없음(prod 는 런타임 변수 미사용),
# 진행 중 배포는 끊지 않음.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

# 기본 최소권한 — build/promote 잡만 OIDC 용 id-token 을 자체 선언으로 추가한다
permissions:
  contents: read

env:
  ECR_REGISTRY: 823164610944.dkr.ecr.ap-northeast-2.amazonaws.com
  IMAGE_REPO: bce-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write   # OIDC 토큰 발급 (aws-actions/configure-aws-credentials)
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Guard — main 브랜치에서만 실행
        # push 트리거는 브랜치가 고정이지만 workflow_dispatch 는 아니다 — dev 코드가 UI 클릭으로
        # production 에 배포되고 prod 별칭까지 따라가는 경로를 빌드 전에 차단 (서버 3차 리뷰 반영)
        run: |
          [ "$GITHUB_REF_NAME" = "main" ] || { echo "::error::production 배포는 main 에서만 — 현재 ref: $GITHUB_REF_NAME"; exit 1; }

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve immutable image tag
        # GITHUB_SHA 고정 12자리 — git rev-parse --short=12 는 "최소" 길이라 prefix 충돌 시
        # rollback 의 정확 일치 검증(12자리)을 통과하지 못한다 (서버 4차 리뷰 반영)
        id: meta
        run: echo "tag=prod-sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Validate build-args (prod 는 트래킹 필수)
        # 2026-08-01 사고 재발 방지: off-box 전환 때 PROD_ 트래킹 3키를 옮기지 않아
        # prod PostHog·GA 가 11일간 죽어 있었는데, 빈 키는 코드가 조용히 건너뛰므로
        # 배포는 계속 초록이었다(루트 docs/13 Part G · docs/38 §4-3).
        # prod 는 값이 비면 여기서 실패시킨다 — staging 과 정책이 반대다.
        env:
          API_BASE_URL: ${{ vars.PROD_NEXT_PUBLIC_API_BASE_URL }}
          PH_KEY: ${{ vars.PROD_NEXT_PUBLIC_POSTHOG_KEY }}
          PH_HOST: ${{ vars.PROD_NEXT_PUBLIC_POSTHOG_HOST }}
          GA_ID: ${{ vars.PROD_NEXT_PUBLIC_GA_ID }}
          KAKAO_KEY: ${{ vars.PROD_NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # 플레이스홀더 탐지 — docs/38 §4-3 의 복붙용 명령어에 들어 있던 'phc_...' 가
          # 그대로 등록됐던 실패(staging, 7/31)를 값 형식과 무관하게 잡는다
          for pair in "API_BASE_URL=$API_BASE_URL" "PH_KEY=$PH_KEY" "PH_HOST=$PH_HOST" "GA_ID=$GA_ID" "KAKAO_KEY=$KAKAO_KEY"; do
            case "${pair#*=}" in
              *...*) fail "플레이스홀더가 등록돼 있다: ${pair%%=*}" ;;
            esac
          done

          # API base URL: 비면 번들이 소스의 defaultApiBaseUrl(=staging 도메인)로 폴백해
          # prod 사용자가 staging 백엔드를 때린다 — 무증상이라 필수 검사 대상
          [ -n "$API_BASE_URL" ] || fail "PROD_NEXT_PUBLIC_API_BASE_URL 미등록 — prod 가 staging 백엔드로 폴백한다"
          case "$API_BASE_URL" in https://*) ;; *) fail "API_BASE_URL 형식 이상: $API_BASE_URL" ;; esac

          [ -n "$PH_KEY" ] || fail "PROD_NEXT_PUBLIC_POSTHOG_KEY 미등록 — 트래킹이 죽은 채 배포된다"
          case "$PH_KEY" in phc_*) ;; *) fail "POSTHOG_KEY 형식 이상 (phc_ 접두사 아님)" ;; esac
          [ "${#PH_KEY}" -ge 44 ] || fail "POSTHOG_KEY 길이 이상 (len=${#PH_KEY}, 기대 48 내외)"

          [ -n "$PH_HOST" ] || fail "PROD_NEXT_PUBLIC_POSTHOG_HOST 미등록"
          case "$PH_HOST" in https://*) ;; *) fail "POSTHOG_HOST 형식 이상" ;; esac

          [ -n "$GA_ID" ] || fail "PROD_NEXT_PUBLIC_GA_ID 미등록 — GA 태그가 빠진 채 배포된다"
          case "$GA_ID" in G-*) ;; *) fail "GA_ID 형식 이상 (G- 접두사 아님)" ;; esac

          # 지도 키는 빠지면 화면에서 바로 보이므로 경고까지만
          [ -n "$KAKAO_KEY" ] || echo "::warning::PROD_NEXT_PUBLIC_KAKAO_MAP_APP_KEY 미등록 — 지도가 뜨지 않는다"

          echo "build-args 검증 통과"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::823164610944:role/bce-gha-ecr-push
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # PROD_ 트래킹 3키는 필수 — 누락은 위 Validate 스텝이 빌드에서 차단한다.
          # 경위는 루트 docs/38 §4-3-A.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PROD_NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_GA_ID=${{ vars.PROD_NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.PROD_NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.PROD_NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_KAKAO_MAP_APP_KEY=${{ vars.PROD_NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
          # sha 불변 태그만 push — prod 별칭은 배포 성공 후 promote 잡이 옮긴다 (서버 리뷰 #89).
          # ⚠️ main 머지 커밋은 dev 와 SHA 가 달라 prod 는 재빌드된다(같은 소스의 재현 빌드).
          tags: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test baked bundle (트래킹·API URL 실물 확인)
        # 위 Validate 는 "변수를 등록했나"만 본다. Dockerfile ARG 누락·build-args 오타·
        # 캐시가 옛 ENV 를 물고 오는 경우는 입력이 멀쩡해도 번들이 빈다 — 그건 여기서만 잡힌다.
        #
        # 이미지를 띄워 HTTP 로 훑지 않고 .next 를 꺼내 grep 한다. HTTP 방식은 "/ 가 어떤 청크를
        # 로드하나"에 의존해서, 앱 리팩터로 literal 이 다른 청크로 옮겨가면 배포가 막히면서
        # 엉뚱한 원인("staging 폴백")을 가리킨다 — 틀린 진단이 붙은 차단이 제일 나쁘다(리뷰 지적).
        # 파일시스템 검사는 그 결합이 없고, 컨테이너 기동·백엔드 도달성과도 무관하며 더 빠르다.
        # 러너에서 검사하므로 실패해도 deploy 잡이 아예 안 돌아 prod 는 무접촉이다.
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          API_BASE_URL: ${{ vars.PROD_NEXT_PUBLIC_API_BASE_URL }}
          PH_KEY: ${{ vars.PROD_NEXT_PUBLIC_POSTHOG_KEY }}
          GA_ID: ${{ vars.PROD_NEXT_PUBLIC_GA_ID }}
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }

          docker pull "$IMAGE"
          docker create --name bce-smoke-fs "$IMAGE" > /dev/null
          docker cp bce-smoke-fs:/app/.next "$RUNNER_TEMP/next"
          docker rm -f bce-smoke-fs > /dev/null

          static="$RUNNER_TEMP/next/static"
          server="$RUNNER_TEMP/next/server"
          # 구조가 바뀌면 "트래킹이 죽었다"가 아니라 "검사 방식이 낡았다"고 말해야 한다
          if [ ! -d "$static" ] || [ ! -d "$server" ]; then
            fail ".next/static·server 를 찾을 수 없다 — 빌드 산출물 구조가 바뀌었다. 이 스텝을 갱신할 것"
          fi

          # 값의 '모양'이 아니라 등록한 값 그대로를 찾는다 — 엉뚱한 GA 속성이나 다른 프로젝트의
          # PostHog 키가 들어가도 통과하던 구멍을 막는다(리뷰 지적). 전부 브라우저에 노출되는
          # 공개값이라 에러 메시지·로그 노출 문제는 없다.
          if ! grep -raqF "$PH_KEY" "$static"; then
            fail "PostHog 토큰이 클라이언트 번들에 없다 — 트래킹이 죽은 이미지다"
          fi
          # 소스의 defaultApiBaseUrl 폴백이 staging 도메인이라, prod 도메인 문자열의 존재가
          # 곧 "env 가 실제로 주입됐다"는 증거다
          if ! grep -raqF "$API_BASE_URL" "$static"; then
            fail "prod API base URL 이 클라이언트 번들에 없다 — staging 백엔드로 폴백한 이미지다"
          fi
          # GA 는 root layout(서버 컴포넌트)에서 렌더돼 서버 청크에 박힌다.
          # ⚠️ 프리렌더 HTML(.next/server/app/*.html)에는 gtag 스크립트가 들어가지 않는다(실측 확인)
          # — HTML 로 검사하려 들지 말 것.
          if ! grep -raqF "$GA_ID" "$server"; then
            fail "GA ID 가 서버 번들에 없다 — GA 태그가 렌더되지 않는다"
          fi

          echo "번들 검증 통과: PostHog·API URL(static) · GA(server) 모두 등록값 그대로 베이크됨"

  deploy:
    needs: build
    runs-on: [self-hosted, production]
    timeout-minutes: 10
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Pull image and swap container
        # checkout·rsync 없음 — 박스 빌드가 사라져 소스가 필요 없다.
        run: |
          set -e
          IMAGE="${ECR_REGISTRY}/${IMAGE_REPO}:${IMAGE_TAG}"

          # timeout: 박스·네트워크 이상 시 잡이 매달리지 않게 하는 안전망(#44 교훈 유지).
          # 잡 상한(10m)보다 내부 예산(pull 5m + run/curl ~1m)이 작아야 OS timeout 이 먼저 발화
          timeout -k 30s 5m docker pull "$IMAGE"

          # 교체 전 현재 이미지를 남긴다 — 배포 실패 시 이 값이 곧 롤백 좌표다 (서버 4차 리뷰 반영)
          prev=$(docker inspect -f '{{.Config.Image}}' buncheoleasy-frontend 2>/dev/null || echo "none")
          echo "::notice::롤백 좌표(직전 이미지): ${prev}"

          docker rm -f buncheoleasy-frontend 2>/dev/null || true
          docker run -d \
            --name buncheoleasy-frontend \
            --restart unless-stopped \
            -p 127.0.0.1:3000:3000 \
            "$IMAGE"

          echo "Waiting for frontend..."
          sleep 3
          curl -fsS -I http://127.0.0.1:3000 > /dev/null && echo "Frontend is up"

      - name: Retain last 3 images (rollback cache)
        # pull 된 태그 이미지는 image prune 으로 안 지워지므로 최근 3개만 남기고 정리
        # (GitHub 불능 시 오프라인 롤백용). 레지스트리 보존은 ECR lifecycle policy 담당.
        # ⚠️ 정렬은 이미지 Created(빌드 시각) 기준 — 롤백으로 되돌린 옛 이미지는 이후 배포
        # 몇 번이면 밀려날 수 있다(실행 중 이미지는 rmi 실패로 살아남음).
        # 취소 시에는 돌지 않는다 — 롤백이 이 배포를 선점(취소)한 순간 오프라인 롤백 캐시를
        # 지우면 안 되기 때문 (리뷰 반영).
        if: success() || failure()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' "${ECR_REGISTRY}/${IMAGE_REPO}" \
            | grep ':prod-sha-' | tail -n +4 | xargs -r docker rmi || true
          docker image prune -f || true

  promote:
    # 별칭은 배포(컨테이너 기동 확인)가 성공한 뒤에만 이동한다 — 실패한 이미지를 별칭이
    # 가리키는 창을 없앤다(서버 리뷰 #89 반영). 재빌드 없이 ECR 매니페스트 재태깅만 한다.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::823164610944:role/bce-gha-ecr-push
          aws-region: ap-northeast-2

      - name: Move 'prod' alias to deployed image
        run: |
          set -e
          # accepted-media-types 명시 — buildx 는 OCI 매니페스트로 push 하므로 요청·회신 포맷을
          # 고정해 put-image 왕복을 결정론적으로 만든다 (서버 3차 리뷰 반영)
          resp=$(aws ecr batch-get-image --repository-name "$IMAGE_REPO" \
            --image-ids imageTag="$IMAGE_TAG" \
            --accepted-media-types "application/vnd.oci.image.manifest.v1+json" "application/vnd.docker.distribution.manifest.v2+json" \
            --output json)
          manifest=$(echo "$resp" | jq -r '.images[0].imageManifest // empty')
          mt=$(echo "$resp" | jq -r '.images[0].imageManifestMediaType // empty')
          # 태그 미존재 시 batch-get-image 는 exit 0 + failures 에만 담긴다 — 명시적 가드 (리뷰 반영)
          [ -n "$manifest" ] || { echo "::error::ECR 에 태그 없음: $IMAGE_TAG"; exit 1; }
          # mediaType 미전달 시 OCI 매니페스트에서 UnsupportedImageTypeException 가능 (리뷰 반영)
          args=(--repository-name "$IMAGE_REPO" --image-tag prod --image-manifest "$manifest")
          [ -n "$mt" ] && args+=(--image-manifest-media-type "$mt")
          out=$(aws ecr put-image "${args[@]}" 2>&1) \
            || { echo "$out" | grep -q ImageAlreadyExistsException || { echo "$out"; exit 1; }; }
          echo "alias 'prod' -> ${IMAGE_TAG}"

      - name: Warn on stale alias
        # deploy 성공 + promote 실패 = 박스는 신버전인데 별칭은 구버전 (서버 4차 리뷰 반영)
        if: failure()
        run: echo "::error::별칭 이동 실패 — 박스는 ${IMAGE_TAG} 로 떠 있으나 'prod' 별칭은 이전 이미지를 가리킨다. 이 잡을 재실행해 별칭을 맞출 것 (docs/38 §5)."
