name: Deploy Frontend Staging

# dev push -> GitHub 호스팅 러너가 이미지를 빌드해 ECR 에 push 하고,
# staging EC2 의 self-hosted runner 는 pull + 컨테이너 교체만 한다.
# 박스에서 next build 를 돌리지 않는다 — 서버 7/29 스왑 스래싱 사고와 같은 유발원 제거
# (루트 docs 35 §8-A · docs/38).
#
# NEXT_PUBLIC_* 는 next build 시점에 번들에 박히므로 GitHub Variables(STAGING_NEXT_PUBLIC_*)로
# 주입한다 — 박스 .env.production 의 같은 키와 값이 일치해야 한다(불일치 시 staging 프론트가
# 다른 백엔드를 때린다). 서버 런타임 변수(TEST_* 등)는 기존대로 박스 .env.production 을
# docker run --env-file 로 주입한다.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: frontend-staging-deploy
  cancel-in-progress: true

# 기본 최소권한 — build/promote 잡만 OIDC 용 id-token 을 자체 선언으로 추가한다
permissions:
  contents: read

env:
  ECR_REGISTRY: 823164610944.dkr.ecr.ap-northeast-2.amazonaws.com
  IMAGE_REPO: bce-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write   # OIDC 토큰 발급 (aws-actions/configure-aws-credentials)
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Guard — dev 브랜치에서만 실행
        # push 트리거는 브랜치가 고정이지만 workflow_dispatch 는 아니다 — 다른 브랜치 코드가
        # staging 에 배포되고 별칭까지 따라가는 경로를 빌드 전에 차단 (서버 3차 리뷰 반영)
        run: |
          [ "$GITHUB_REF_NAME" = "dev" ] || { echo "::error::staging 배포는 dev 에서만 — 현재 ref: $GITHUB_REF_NAME"; exit 1; }

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve immutable image tag
        # GITHUB_SHA 고정 12자리 — git rev-parse --short=12 는 "최소" 길이라 prefix 충돌 시
        # rollback 의 정확 일치 검증(12자리)을 통과하지 못한다 (서버 4차 리뷰 반영)
        id: meta
        run: echo "tag=staging-sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Validate build-args (staging 은 트래킹 OFF 가 정상)
        # staging 은 prod 와 정책이 반대다 — 트래킹 키가 "비어 있는 것"이 의도된 상태.
        # staging·prod 가 같은 PostHog 프로젝트·같은 GA 속성을 쓰기 때문에 staging 을 켜두면
        # QA 클릭이 prod 퍼널에 섞인다(2026-08-12 확인). 검증이 필요할 때만 일시 등록하고
        # 끝나면 지운다 — 지우는 걸 잊으면 아래 경고가 잡아준다.
        env:
          API_BASE_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_BASE_URL }}
          PH_KEY: ${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_KEY }}
          PH_HOST: ${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_HOST }}
          GA_ID: ${{ vars.STAGING_NEXT_PUBLIC_GA_ID }}
          KAKAO_KEY: ${{ vars.STAGING_NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # build-arg 로 넘기는 값은 전부 플레이스홀더 검사를 통과해야 한다 — 하나라도 빠지면
          # 그 변수만 무방비가 된다(리뷰 지적: PH_HOST·KAKAO_KEY 누락)
          for pair in "API_BASE_URL=$API_BASE_URL" "PH_KEY=$PH_KEY" "PH_HOST=$PH_HOST" "GA_ID=$GA_ID" "KAKAO_KEY=$KAKAO_KEY"; do
            case "${pair#*=}" in
              *...*) fail "플레이스홀더가 등록돼 있다: ${pair%%=*}" ;;
            esac
          done

          [ -n "$API_BASE_URL" ] || fail "STAGING_NEXT_PUBLIC_API_BASE_URL 미등록"
          case "$API_BASE_URL" in https://*) ;; *) fail "API_BASE_URL 형식 이상: $API_BASE_URL" ;; esac
          # legacy IP 는 lib/auth-api.ts 가 defaultApiBaseUrl 로 되돌린다 — 번들 리터럴만 보고는
          # 못 잡는 예외라 입력에서 차단(prod 워크플로와 동일)
          case "$API_BASE_URL" in
            http://13.124.248.60*|https://13.124.248.60*) fail "legacy IP 는 코드가 폴백시킨다 — 실제 도메인을 쓸 것" ;;
          esac

          # 호스트는 키 없이는 아무것도 켜지 않지만, 값이 있으면 형식은 맞아야 한다
          if [ -n "$PH_HOST" ]; then
            case "$PH_HOST" in https://*) ;; *) fail "POSTHOG_HOST 형식 이상" ;; esac
          fi

          # 값이 있을 때만 형식을 본다. 켜져 있다는 사실 자체를 경고로 남긴다
          if [ -n "$PH_KEY" ]; then
            echo "::warning::staging PostHog 가 켜져 있다 — prod 퍼널 오염. 검증 끝났으면 변수를 삭제할 것"
            case "$PH_KEY" in phc_*) ;; *) fail "POSTHOG_KEY 형식 이상" ;; esac
            [ "${#PH_KEY}" -ge 44 ] || fail "POSTHOG_KEY 길이 이상 (len=${#PH_KEY})"
            # 일시 등록 시 KEY 만 넣고 HOST 를 빠뜨리는 조합을 막는다. Dockerfile 은 ARG 미전달을
            # 빈 문자열로 ENV 에 세팅하고, instrumentation-client.ts 의 '??' 는 빈 문자열을
            # 폴백시키지 않는다 → api_host: "" 로 조용히 죽는다(이 PR 이 없애려는 실패 모드)
            [ -n "$PH_HOST" ] || fail "POSTHOG_KEY 만 등록됐다 — HOST 가 비면 api_host 가 빈 문자열이 되어 트래킹이 조용히 죽는다"
          fi
          if [ -n "$GA_ID" ]; then
            echo "::warning::staging GA 가 켜져 있다 — prod 와 같은 속성이라 데이터가 섞인다"
            case "$GA_ID" in G-*) ;; *) fail "GA_ID 형식 이상" ;; esac
          fi

          # 값 자체는 찍지 않는다 — ON/OFF 만
          echo "build-args 검증 통과 (PostHog=$([ -n "$PH_KEY" ] && echo ON || echo OFF) / GA=$([ -n "$GA_ID" ] && echo ON || echo OFF))"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::823164610944:role/bce-gha-ecr-push
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 프론트 이미지는 환경별로 굽는다(NEXT_PUBLIC 빌드타임 베이크) — staging- 접두 태그
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.STAGING_NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_GA_ID=${{ vars.STAGING_NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_KAKAO_MAP_APP_KEY=${{ vars.STAGING_NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
          # sha 불변 태그만 push — staging 별칭은 헬스체크 통과 후 promote 잡이 옮긴다
          # ("별칭 = 지금 떠 있는 것" 불변식, 서버 리뷰 #89 반영)
          tags: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          # provenance attestation 은 ECR untagged 매니페스트 노이즈 — 단일 아키라 끈다
          provenance: false
          # npm 의존성 레이어 재사용 — 2회차부터 빌드가 크게 준다
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test baked bundle (변수 ↔ 번들 일치 확인)
        # 양방향 검사다. 켜기로 했으면 박혀 있어야 하고, 끄기로 했으면 없어야 한다.
        # "끈 줄 알았는데 실은 켜져 있는" 상태(= prod 퍼널 오염)를 잡는 게 staging 쪽 목적.
        # 검사 방식(컨테이너 기동 대신 .next grep)의 근거는 prod 워크플로 같은 스텝 주석 참고.
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          API_BASE_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_BASE_URL }}
          PH_KEY: ${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_KEY }}
          PH_HOST: ${{ vars.STAGING_NEXT_PUBLIC_POSTHOG_HOST }}
          GA_ID: ${{ vars.STAGING_NEXT_PUBLIC_GA_ID }}
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }

          docker pull "$IMAGE"
          docker create --name bce-smoke-fs "$IMAGE" > /dev/null

          static="$RUNNER_TEMP/next-static"
          server="$RUNNER_TEMP/next-server"
          docker cp bce-smoke-fs:/app/.next/static "$static" \
            || fail ".next/static 을 꺼낼 수 없다 — 빌드 산출물 구조가 바뀌었다. 이 스텝을 갱신할 것"
          docker cp bce-smoke-fs:/app/.next/server "$server" \
            || fail ".next/server 를 꺼낼 수 없다 — 빌드 산출물 구조가 바뀌었다. 이 스텝을 갱신할 것"
          docker rm -f bce-smoke-fs > /dev/null

          # API base URL 은 트래킹과 무관하게 확인한다 — 값이 어긋나면 QA 클릭이 prod 데이터를
          # '쓰게' 된다(퍼널 오염보다 무겁다). ⚠️ 다만 prod 쪽만큼 강한 검사는 아니다:
          # 소스의 defaultApiBaseUrl 이 staging 도메인이라, 변수가 아예 비어도 폴백 리터럴이
          # 남아 통과한다. 미등록은 위 Validate 가 막고, 여기서는 ARG 배선 끊김을 잡는다.
          if ! grep -raqF -e "$API_BASE_URL" "$static"; then
            fail "staging API base URL 이 클라이언트 번들에 없다 — build-arg 배선이 끊겼다"
          fi

          if [ -n "$PH_KEY" ]; then
            if ! grep -raqF -e "$PH_KEY" "$static"; then
              fail "POSTHOG_KEY 를 등록했는데 클라이언트 번들에 없다"
            fi
            if ! grep -raqF -e "$PH_HOST" "$static"; then
              fail "POSTHOG_HOST 가 클라이언트 번들에 없다 — api_host 가 빈 문자열이 된다"
            fi
          else
            # 비교할 값이 없으니 '토큰 모양'을 앵커로 쓴다.
            # ⚠️ 'phc_' 만으로 잡지 않는 이유: posthog-js 는 키 유무와 무관하게 top-level import 라
            # 라이브러리 코드가 항상 번들에 들어간다. 2026-08-12 실측으로는 라이브러리에 phc_
            # 리터럴이 없지만(매칭 1건 = 주입된 값 자체), 캐럿 범위(^1.398.0) 업그레이드로
            # 생기면 staging 배포가 상시 차단된다 — 그 결합을 피한다.
            # 플레이스홀더(phc_...)는 이 정규식에 안 걸리지만 Validate 의 *...* 검사가 입력에서 막는다.
            if grep -raqE 'phc_[A-Za-z0-9]{20,}' "$static"; then
              fail "POSTHOG_KEY 는 비었는데 번들에 PostHog 토큰이 박혀 있다 — prod 퍼널이 오염된다"
            fi
          fi

          if [ -n "$GA_ID" ]; then
            if ! grep -raqF -e "$GA_ID" "$server"; then
              fail "GA_ID 를 등록했는데 서버 번들에 없다"
            fi
          else
            # GA 는 '꺼진 것'을 번들에서 단정할 앵커가 없다: @next/third-parties 모듈이
            # import 만으로 'googletagmanager' literal 을 싣고, 렌더 여부와 무관하게 남는다.
            # 'G-[A-Z0-9]+' shape 는 프레임워크 코드 오탐 위험이 있어 쓰지 않는다.
            # 설정 쪽은 위 Validate 스텝의 경고가 담당한다.
            echo "::notice::GA_ID 미등록 — 번들 단정은 생략(앵커 없음), 설정 검사는 Validate 스텝이 담당"
          fi

          echo "번들 검증 통과 (변수 설정과 일치)"

  deploy:
    needs: build
    runs-on: [self-hosted, staging]
    timeout-minutes: 10
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Pull image and swap container
        # checkout·rsync 없음 — 박스 빌드가 사라져 소스가 필요 없다.
        # .env.production 은 배포 디렉터리에 그대로 상주한다(런타임 변수 주입용).
        run: |
          set -e
          IMAGE="${ECR_REGISTRY}/${IMAGE_REPO}:${IMAGE_TAG}"

          # timeout: 박스·네트워크 이상 시 잡이 매달리지 않게 하는 안전망(#44 교훈 유지).
          # 잡 상한(10m)보다 내부 예산(pull 5m + run/curl ~1m)이 작아야 OS timeout 이 먼저 발화
          timeout -k 30s 5m docker pull "$IMAGE"

          # 교체 전 현재 이미지를 남긴다 — 배포 실패 시 이 값이 곧 롤백 좌표다 (서버 4차 리뷰 반영)
          prev=$(docker inspect -f '{{.Config.Image}}' buncheoleasy-frontend 2>/dev/null || echo "none")
          echo "::notice::롤백 좌표(직전 이미지): ${prev}"

          docker rm -f buncheoleasy-frontend 2>/dev/null || true
          # 런타임 env(.env.production): 서버 런타임 변수(TEST_* 등) 주입.
          # NEXT_PUBLIC_* 는 빌드 때 이미 번들에 박혀 있어 여기서는 효력이 없다.
          docker run -d \
            --name buncheoleasy-frontend \
            --restart unless-stopped \
            -p 127.0.0.1:3000:3000 \
            --env-file /home/ubuntu/buncheol-easy-client/.env.production \
            "$IMAGE"

          echo "Waiting for frontend..."
          sleep 3
          curl -fsS -I http://127.0.0.1:3000 > /dev/null && echo "Frontend is up"

      - name: Retain last 3 images (rollback cache)
        # pull 된 태그 이미지는 image prune 으로 안 지워지므로 최근 3개만 남기고 정리
        # (GitHub 불능 시 오프라인 롤백용). 레지스트리 보존은 ECR lifecycle policy 담당.
        # ⚠️ 정렬은 이미지 Created(빌드 시각) 기준 — 롤백으로 되돌린 옛 이미지는 이후 배포
        # 몇 번이면 밀려날 수 있다(실행 중 이미지는 rmi 실패로 살아남음).
        # 취소 시에는 돌지 않는다 — 롤백이 이 배포를 선점(취소)한 순간 오프라인 롤백 캐시를
        # 지우면 안 되기 때문 (리뷰 반영).
        if: success() || failure()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' "${ECR_REGISTRY}/${IMAGE_REPO}" \
            | grep ':staging-sha-' | tail -n +4 | xargs -r docker rmi || true
          docker image prune -f || true

  promote:
    # 별칭은 배포(컨테이너 기동 확인)가 성공한 뒤에만 이동한다 — 실패한 이미지를 별칭이
    # 가리키는 창을 없앤다(서버 리뷰 #89 반영). 재빌드 없이 ECR 매니페스트 재태깅만 한다.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::823164610944:role/bce-gha-ecr-push
          aws-region: ap-northeast-2

      - name: Move 'staging' alias to deployed image
        run: |
          set -e
          # accepted-media-types 명시 — buildx 는 OCI 매니페스트로 push 하므로 요청·회신 포맷을
          # 고정해 put-image 왕복을 결정론적으로 만든다 (서버 3차 리뷰 반영)
          resp=$(aws ecr batch-get-image --repository-name "$IMAGE_REPO" \
            --image-ids imageTag="$IMAGE_TAG" \
            --accepted-media-types "application/vnd.oci.image.manifest.v1+json" "application/vnd.docker.distribution.manifest.v2+json" \
            --output json)
          manifest=$(echo "$resp" | jq -r '.images[0].imageManifest // empty')
          mt=$(echo "$resp" | jq -r '.images[0].imageManifestMediaType // empty')
          # 태그 미존재 시 batch-get-image 는 exit 0 + failures 에만 담긴다 — 명시적 가드 (리뷰 반영)
          [ -n "$manifest" ] || { echo "::error::ECR 에 태그 없음: $IMAGE_TAG"; exit 1; }
          # mediaType 미전달 시 OCI 매니페스트에서 UnsupportedImageTypeException 가능 (리뷰 반영)
          args=(--repository-name "$IMAGE_REPO" --image-tag staging --image-manifest "$manifest")
          [ -n "$mt" ] && args+=(--image-manifest-media-type "$mt")
          out=$(aws ecr put-image "${args[@]}" 2>&1) \
            || { echo "$out" | grep -q ImageAlreadyExistsException || { echo "$out"; exit 1; }; }
          echo "alias 'staging' -> ${IMAGE_TAG}"

      - name: Warn on stale alias
        # deploy 성공 + promote 실패 = 박스는 신버전인데 별칭은 구버전 (서버 4차 리뷰 반영)
        if: failure()
        run: echo "::error::별칭 이동 실패 — 박스는 ${IMAGE_TAG} 로 떠 있으나 'staging' 별칭은 이전 이미지를 가리킨다. 이 잡을 재실행해 별칭을 맞출 것 (docs/38 §5)."
